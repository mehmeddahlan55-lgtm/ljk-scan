@media(max-width:380px){.topbar{padding:10px 13px}.workspace{padding:0 13px 20px}.brand-copy strong{font-size:14px}.brand-copy span{font-size:10px}.page-head{align-items:flex-start;flex-direction:column}.page-actions{justify-content:flex-start}.tile{padding:15px}.hero-tile{min-height:148px}.ring{width:90px;height:90px}.ring:before{width:69px;height:69px}.ring span{font-size:17px}.answer-strip{gap:3px}.ans-box{height:27px;font-size:9px}.student-info strong{font-size:12px}.score-dot{width:50px;height:50px;font-size:15px}.result-actions{gap:4px}.result-actions .btn{font-size:10px;padding:7px}.answer-grid{gap:5px}.answer-cell{padding:8px 1px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<body>
<div class="app">
<header class="topbar">
 <button class="brand" id="brandButton" aria-label="Buka sampul aplikasi">
  <span class="brand-mark"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 13.5 23.8 7 40 13.5v21L24 41 8 34.5v-21Z" stroke="currentColor" stroke-width="2.8"/><path d="M15 18.5 24 22l9-3.5M24 22v12M15 18.5v11l9 4.5 9-4.5v-11" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="m19 13 5-2 5 2" stroke="currentColor" stroke-width="2"/></svg></span>
  <span class="brand-copy"><strong>Koreksi Lembar Jawab</strong><span>OMR sederhana · bekerja di perangkat</span></span>
 </button>
 <div class="top-actions"><span id="activeExamLabel" class="muted" style="font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button class="icon-btn" id="themeButton" aria-label="Ganti tema" title="Ganti tema">◐</button></div>
</header>
<div class="workspace">
 <aside class="navdesk" id="desktopNav" aria-label="Navigasi utama"></aside>
 <main class="main" id="mainContent" tabindex="-1"></main>
</div>
<footer class="credit">Aplikasi oleh Aras Hidayat, S.Pd · SMA Negeri 3 Paloh</footer>
<nav class="bottom-nav" id="mobileNav" aria-label="Menu utama"></nav>
</div>
<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>
<div class="modal-backdrop" id="cameraModal" role="dialog" aria-modal="true" aria-label="Kamera pemindai">
 <div class="modal">
  <div class="modal-head"><div><div class="eyebrow">Pindai lembar</div><h2>Kamera pemindai</h2></div><button class="close-btn" data-action="close-camera" aria-label="Tutup kamera">×</button></div>
  <div class="camera-stage"><video id="cameraVideo" autoplay muted playsinline></video><div class="camera-guides"></div></div>
  <div class="camera-status" id="cameraStatus">Menyiapkan kamera…</div>
  <div class="camera-controls"><button class="gallery-button" data-action="open-gallery">▧ Galeri</button><button class="shutter" id="shutterButton" aria-label="Ambil foto manual">Ambil foto</button><span style="width:86px;font-size:10px;color:var(--muted);text-align:center">Otomatis saat stabil</span></div>
 </div>
</div>
<div class="modal-backdrop" id="generalModal" role="dialog" aria-modal="true"><div class="modal" id="generalModalContent"></div></div>
<input class="camera-hidden-input" type="file" id="galleryInput" accept="image/*">
<input class="camera-hidden-input" type="file" id="backupInput" accept="application/json,.json">
<input class="camera-hidden-input" type="file" id="keyImageInput" accept="image/*">
<div class="cover" id="cover" role="dialog" aria-modal="true" aria-label="Sampul Koreksi Lembar Jawab">
 <div class="cover-inner"><div class="cover-logo" id="coverLogo" role="button" tabindex="0" aria-label="Logo aplikasi"><svg viewBox="0 0 48 48" fill="none"><path d="M7 13 24 6l17 7v22l-17 7L7 35V13Z" stroke="currentColor" stroke-width="2.5"/><path d="m14 18 10 4 10-4M24 22v13m-10-17v12l10 5 10-5V18" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg></div><div class="cover-kicker">Pemindaian lembar jawaban</div><h1>Koreksi<br>Lembar Jawab</h1><p>Periksa pilihan ganda lebih cepat, langsung dari foto HP.</p><button class="btn" data-action="dismiss-cover">Mulai Mengoreksi <span>→</span></button><div class="cover-by">Oleh Aras Hidayat, S.Pd<br>SMA Negeri 3 Paloh</div></div>
</div>
<script>
'use strict';
const STORAGE_KEY='koreksi-ljk-v2', THEME_KEY='koreksi-ljk-tema', COVER_KEY='koreksi-ljk-sampul';
const FORM={w:1200,h:566,tl:{x:34,y:34},tr:{x:1166,y:34},br:{x:1166,y:532},bl:{x:34,y:532},marker:34.3,bubbleRadius:11.3};
const ANSWERS=['A','B','C','D','E'];
const $=s=>document.querySelector(s); const $$=s=>Array.from(document.querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blankState=()=>({version:2,activeExamId:null,exams:[],activity:[]});
let state=loadState(), route='settings', settingsTab='jenis', resultsTab='peringkat', pending=[], cameraStream=null,cameraTimer=null,cameraStable=0,cameraPrev=null,cameraStarted=0,cameraBusy=false;
let draft={type:'Sumatif Ganjil',subject:'',className:'',questionCount:50};
let keyDraft=null, historySearch='';
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return blankState();const x=JSON.parse(raw);if(x.version!==2||!Array.isArray(x.exams))return blankState();return x}catch(e){return blankState()}}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true}catch(e){toast('Penyimpanan penuh. Ekspor cadangan lalu kurangi foto tersimpan.');return false}}
function activeExam(){return state.exams.find(e=>e.id===state.activeExamId)||null}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toastStack').append(t);setTimeout(()=>t.remove(),2900)}
function activity(exam,msg){if(!exam)return;exam.activity=exam.activity||[];exam.activity.unshift({id:uid(),text:msg,at:Date.now()});exam.activity=exam.activity.slice(0,30);state.activity.unshift({examId:exam.id,text:msg,at:Date.now()});state.activity=state.activity.slice(0,80)}
function navHTML(where){const items=[['settings','⚙','Pengaturan'],['scan','◎','Pindai'],['results','▤','Hasil'],['history','◷','Riwayat']];return items.map(([id,ico,label])=>`<button class="nav-item ${route===id?'active':''}" data-route="${id}" aria-label="${label}" ${route===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${ico}</span><span class="nav-label">${label}</span>${id==='results'&&activeExam()?.records?.length?`<span class="nav-badge">${activeExam().records.length}</span>`:''}</button>`).join('')}
function render(){
 $('#desktopNav').innerHTML=navHTML('desktop');$('#mobileNav').innerHTML=navHTML('mobile');
 const exam=activeExam();$('#activeExamLabel').textContent=exam?`${exam.subject||'Ujian'} · ${exam.className||'Kelas'}`:'Belum ada ujian';
 if(route==='settings')renderSettings();else if(route==='scan')renderScan();else if(route==='results')renderResults();else renderHistory();
}
function setRoute(r){route=r;render();window.scrollTo({top:0,behavior:'smooth'})}
function renderSettings(){
 const exam=activeExam();
 let tabs=`<div class="tabs" role="tablist"><button class="tab ${settingsTab==='jenis'?'active':''}" data-setting-tab="jenis">Jenis Ujian</button><button class="tab ${settingsTab==='kunci'?'active':''}" data-setting-tab="kunci">Kunci Jawaban</button><button class="tab ${settingsTab==='lembar'?'active':''}" data-setting-tab="lembar">Lembar Jawab</button></div>`;
 let content='';
 if(settingsTab==='jenis'){
  content=`<div class="surface setting-card"><div class="section-head"><div><h2>Ujian aktif</h2><p>Pilih ujian atau siapkan ujian baru.</p></div><button class="btn btn-soft btn-small" data-action="new-exam">＋ Ujian baru</button></div>
   ${state.exams.length?`<div class="field"><label for="examSelect">Daftar ujian tersimpan</label><select id="examSelect"><option value="">Pilih ujian…</option>${state.exams.map(e=>`<option value="${e.id}" ${e.id===state.activeExamId?'selected':''}>${safe(e.subject||'Tanpa mapel')} · ${safe(e.className||'Tanpa kelas')} (${safe(e.type)})</option>`).join('')}</select></div>`:`<div class="code-note">Belum ada ujian tersimpan. Isi formulir di bawah atau gunakan ujian contoh untuk mencoba aplikasi.</div>`}
   <div class="divider"></div><div class="section-head"><h2>${draft.id?'Ubah draf ujian':'Rincian ujian baru'}</h2><span class="chip chip-blank">Draf belum tersimpan</span></div>
   <div class="field-row"><div class="field"><label for="draftType">Jenis ujian</label><select id="draftType">${['Sumatif Ganjil','Sumatif Genap','Sumatif Tengah Semester','Ulangan Harian','Kuis','Ujian Praktik','Lainnya'].map(x=>`<option ${draft.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="draftSubject">Mata pelajaran</label><input id="draftSubject" placeholder="Contoh: Matematika" value="${safe(draft.subject)}"></div><div class="field"><label for="draftClass">Kelas</label><input id="draftClass" placeholder="Contoh: X IPA 1" value="${safe(draft.className)}"></div><div class="field"><label for="draftCount">Jumlah soal</label><select id="draftCount"><option value="40" ${draft.questionCount===40?'selected':''}>40 soal</option><option value="50" ${draft.questionCount===50?'selected':''}>50 soal</option></select></div></div>
   <div class="divider"></div><div class="status-row"><div class="muted" style="font-size:11px">${exam?`Aktif: <b>${safe(exam.subject||'Ujian')}</b>`:'Belum ada ujian aktif'}</div><button class="btn btn-primary" data-action="save-exam">Simpan jenis ujian →</button></div></div>
   <div class="surface setting-card" style="margin-top:12px"><div class="section-head"><div><h2>Ingin mencoba dahulu?</h2><p>Demo berisi kunci jawaban dan 14 siswa contoh.</p></div><span style="font-size:25px">✦</span></div><button class="btn btn-blue btn-wide" data-action="demo">Beralih ke ujian contoh</button></div>`;
 }else if(settingsTab==='kunci'){
  if(!exam){content=emptyBlock('🗝️','Belum ada ujian','Buat atau pilih ujian terlebih dahulu untuk mengisi kunci jawaban.','Kembali ke Jenis Ujian','settings');}
  else {const keys=keyDraft&&keyDraft.examId===exam.id?keyDraft.keys:exam.keys;const filled=keys.slice(0,50).filter(Boolean).length;
   content=`<div class="surface setting-card"><div class="section-head"><div><h2>Kunci jawaban</h2><p>Ketuk nomor untuk memutar A → E → kosong.</p></div><strong style="font-size:19px">${filled} / 50</strong></div><div class="progress-track"><span style="width:${filled/50*100}%"></span></div><div class="key-grid" style="margin-top:16px">${keys.map((a,i)=>`<button class="key-item ${a?'filled':''}" data-key="${i}" aria-label="Soal ${i+1}, ${a||'kosong'}"><span class="q">${i+1}</span><span class="ans">${a||'–'}</span></button>`).join('')}</div><div class="divider"></div><div class="field"><label for="pasteKeys">Tempel kunci jawaban</label><textarea id="pasteKeys" placeholder="Contoh: A B C D E … atau 1A, 2B, 3C"></textarea><p class="helper">Boleh dipisah spasi, koma, atau baris baru. Nomor soal dapat ditulis seperti 1A, 2B, dan seterusnya.</p></div><div class="history-actions"><button class="btn btn-soft btn-small" data-action="paste-keys">Terapkan teks</button><button class="btn btn-soft btn-small" data-action="scan-key">▣ Pindai lembar kunci</button><button class="btn btn-danger btn-small" data-action="clear-keys">Kosongkan kunci</button></div><div class="divider"></div><div class="status-row"><span class="muted" style="font-size:11px">${exam.questionCount} soal digunakan untuk penilaian.</span><button class="btn btn-primary" data-action="save-keys">Simpan & Lanjut →</button></div></div>`;
  }
 }else{
  content=`<div class="surface setting-card"><div class="section-head"><div><h2>Lembar jawaban standar</h2><p>50 nomor pilihan A–E, empat kotak penanda sudut.</p></div><span style="font-size:25px">▤</span></div><div class="code-note">Cetak satu halaman A4 atau F4, lalu potong menjadi tiga kartu horizontal. Satu foto dapat memuat satu kartu atau ketiganya sekaligus. Hanya kartu dengan empat kotak hitam yang akan dibaca. Tulisan nama siswa diketik setelah pemindaian.</div><div class="print-grid" style="margin-top:14px"><div class="print-card"><span>▧</span><strong>Ukuran A4</strong><a class="btn btn-primary btn-wide" href="lembar/lembar-jawab-A4.pdf" download>Unduh A4</a></div><div class="print-card"><span>▧</span><strong>Ukuran F4</strong><a class="btn btn-primary btn-wide" href="lembar/lembar-jawab-F4.pdf" download>Unduh F4</a></div></div><div class="divider"></div><h3 style="font-size:14px;margin:0 0 8px">Petunjuk pengisian</h3><ol class="muted" style="padding-left:20px;font-size:12px;margin:0"><li>Gunakan pensil 2B atau pulpen hitam/biru tua.</li><li>Hitamkan satu bulatan secara penuh, jangan memberi tanda silang.</li><li>Pastikan empat kotak hitam di sudut tidak tertutup.</li><li>Hindari lipatan tepat pada area kotak penanda.</li></ol><p class="helper">Kolom nama pada lembar cetak adalah panduan. Nama siswa dimasukkan melalui aplikasi.</p></div>`;
 }
 $('#mainContent').innerHTML=`<div class="page-head"><div><div class="eyebrow">Pusat pengaturan</div><h1 class="page-title">Pengaturan</h1><p class="page-sub">Siapkan ujian dan kunci sebelum mulai memindai.</p></div></div>${tabs}<div class="section">${content}</div>`;
}
function emptyBlock(emoji,title,desc,button='Buka Pengaturan',target='settings'){return `<div class="surface empty"><div class="empty-emoji">${emoji}</div><h3>${title}</h3><p>${desc}</p><button class="btn btn-primary" data-route="${target}">${button} →</button></div>`}
function renderScan(){const exam=activeExam();
 if(!exam){$('#mainContent').innerHTML=`<div class="page-head"><div><div class="eyebrow">Kamera & galeri</div><h1 class="page-title">Pindai lembar</h1><p class="page-sub">Ambil foto lembar jawaban untuk diperiksa.</p></div></div>${emptyBlock('📷','Belum ada ujian aktif','Buat ujian dan isi kunci jawaban dahulu.','Buka Pengaturan')}`;return}
 const ready=exam.keys.slice(0,exam.questionCount).every(Boolean);
 $('#mainContent').innerHTML=`<div class="page-head"><div><div class="eyebrow">${safe(exam.type)} · ${safe(exam.className)}</div><h1 class="page-title">Pindai lembar</h1><p class="page-sub">${safe(exam.subject)} · ${exam.questionCount} soal · semua pemrosesan di HP</p></div><span class="chip ${ready?'chip-good':'chip-warn'}">${ready?'Kunci siap':'Kunci belum lengkap'}</span></div>
 ${!ready?`<div class="code-note" style="margin-bottom:13px">Masih ada kunci yang kosong. Hasil tetap bisa dipindai, tetapi nilai akan dihitung setelah kunci dilengkapi.</div>`:''}
 <div class="tile tile-blue" style="display:flex;align-items:center;gap:15px;margin-bottom:14px"><div style="font-size:34px">◎</div><div><strong style="font-size:15px">Satu foto, hingga tiga lembar</strong><div style="font-size:11px;opacity:.8;margin-top:4px">Letakkan lembar di tempat terang. Empat kotak hitam harus terlihat utuh.</div></div></div>
 <div class="grid" style="grid-template-columns:1fr 1fr"><button class="tile tile-neutral" data-action="open-camera" style="border:0;text-align:left;min-height:150px"><span style="font-size:30px">📷</span><strong style="display:block;margin-top:12px;font-size:15px">Buka Kamera</strong><small class="muted">Deteksi dan foto otomatis</small></button><button class="tile tile-neutral" data-action="open-gallery" style="border:0;text-align:left;min-height:150px"><span style="font-size:30px">▧</span><strong style="display:block;margin-top:12px;font-size:15px">Pilih Galeri</strong><small class="muted">Gunakan foto yang sudah ada</small></button></div>
 <div class="section"><div class="section-head"><h2>Petunjuk foto yang baik</h2></div><div class="surface setting-card"><div class="grid" style="gap:11px"><div class="status-row"><span>✓ Empat kotak hitam terlihat</span><span class="chip chip-good">Wajib</span></div><div class="status-row"><span>✓ Kartu tidak tertutup tangan</span><span class="chip chip-good">Wajib</span></div><div class="status-row"><span>✓ Foto tidak terlalu jauh</span><span class="chip chip-good">Disarankan</span></div><div class="status-row"><span>✓ Hindari pantulan lampu dan blur</span><span class="chip chip-warn">Periksa</span></div></div></div></div>
 ${pending.length?renderPending():''}`;
}
function calcStats(exam,answers){let correct=0,wrong=0,blank=0,check=0,double=0;for(let i=0;i<exam.questionCount;i++){let a=answers[i]||'';if(a==='cek'){check++;continue}if(!a){blank++;continue}if(a==='ganda'){wrong++;double++;continue}if(exam.keys[i]&&a===exam.keys[i])correct++;else wrong++}const score=exam.questionCount?Math.round(correct/exam.questionCount*1000)/10:0;return{correct,wrong,blank,check,double,score}}
function renderPending(){return `<div class="section"><div class="section-head"><div><h2>Hasil sementara</h2><p>${pending.length} lembar belum disimpan</p></div></div><div class="grid">${pending.map((p,i)=>pendingCard(p,i)).join('')}</div><div class="sticky-actions"><button class="btn btn-soft" data-action="open-camera">📷 Foto lagi</button><button class="btn btn-soft" data-action="open-gallery">▧ Galeri</button><button class="btn btn-primary" data-action="save-all">Simpan semua (${pending.length})</button></div></div>`}
function pendingCard(p,i){const exam=activeExam(),s=calcStats(exam,p.answers);return `<article class="result-card" data-pending="${p.id}"><div class="result-top"><div class="score-dot">${s.score}</div><div class="student-info"><strong>Lembar ${i+1} dari ${pending.length}</strong><small>${p.detectedLabel||'Lembar terdeteksi'} · ${p.answers.filter(a=>a==='cek').length} perlu dicek</small></div><div class="result-actions"><button class="btn btn-soft btn-small" data-action="discard-pending" data-id="${p.id}">Buang</button></div></div><div class="field" style="margin-top:12px"><label>Nama siswa</label><input data-pending-name="${p.id}" value="${safe(p.name||'')}" placeholder="Ketik nama siswa" autocomplete="off"></div>${resultChips(s)}${answerStrip(exam,p.answers)}<div class="history-actions"><button class="btn btn-soft btn-small" data-action="review-pending" data-id="${p.id}">Koreksi jawaban</button><button class="btn btn-primary btn-small" data-action="save-one" data-id="${p.id}">Simpan hasil</button></div>${p.open?pendingReview(p):''}</article>`}
function resultChips(s){return `<div class="result-stats"><span class="chip chip-good">Benar ${s.correct}</span><span class="chip chip-bad">Salah ${s.wrong}</span><span class="chip chip-blank">Kosong ${s.blank}</span>${s.check?`<span class="chip chip-check">Cek ${s.check}</span>`:''}</div>`}
function answerStrip(exam,answers){return `<div class="answer-strip">${answers.slice(0,exam.questionCount).map((a,i)=>{let cls=!a?'ans-empty':a==='ganda'?'ans-double':a==='cek'?'ans-review':exam.keys[i]&&a===exam.keys[i]?'ans-correct':'ans-wrong';return `<div class="ans-box ${cls}" title="Soal ${i+1}: ${a||'Kosong'}">${a==='ganda'?'×':a==='cek'?'?':a||'–'}${a==='cek'?'<small>!</small>':''}</div>`}).join('')}</div>`}
function pendingReview(p){const exam=activeExam();return `<div class="review-panel"><div class="section-head"><div><h3 style="margin:0;font-size:14px">Koreksi manual</h3><small class="muted">Ketuk nomor untuk mengganti jawaban.</small></div><button class="btn btn-soft btn-small" data-action="close-review" data-id="${p.id}">Tutup</button></div><div class="review-layout">${p.preview?`<div class="review-image"><img src="${p.preview}" alt="Foto lembar jawaban yang diluruskan"><small>Pratinjau hasil lurus · tersimpan lokal</small></div>`:''}<div class="review-grid">${p.answers.slice(0,exam.questionCount).map((a,i)=>`<button class="review-question" data-pending-answer="${p.id}:${i}"><span class="rq">Soal ${i+1}</span><b>${a==='ganda'?'Ganda':a==='cek'?'Cek':a||'Kosong'}</b></button>`).join('')}</div></div></div>`}
function renderResults(){const exam=activeExam();if(!exam){$('#mainContent').innerHTML=`<div class="page-head"><div><div class="eyebrow">Rekap penilaian</div><h1 class="page-title">Hasil</h1><p class="page-sub">Ringkasan nilai siswa dan analisis soal.</p></div></div>${emptyBlock('📊','Belum ada hasil ujian','Pilih atau buat ujian, lalu pindai lembar jawaban siswa.','Ke Pengaturan')}`;return}

function parsePastedKeys(text){const out=Array(50).fill(null);const pairs=[...text.matchAll(/(?:^|[^\d])([1-5]?\d)\s*[:.)\-]?\s*([A-E])/gi)];if(pairs.length>=3){pairs.forEach(m=>{let n=Number(m[1]);if(n>=1&&n<=50)out[n-1]=m[2].toUpperCase()});return out}const chars=text.toUpperCase().match(/[A-E]/g)||[];chars.slice(0,50).forEach((x,i)=>out[i]=x);return out}
function saveRecord(p){const exam=activeExam();if(!exam)return;let name=(p.name||'').trim();if(!name){toast('Isi nama siswa sebelum menyimpan');document.querySelector(`[data-pending-name="${p.id}"]`)?.focus();return false}const duplicate=exam.records.some(r=>r.name.trim().toLocaleLowerCase('id')===name.toLocaleLowerCase('id'));if(duplicate&&!p.duplicateApproved){if(!confirm(`Nama "${name}" sudah ada. Simpan sebagai lembar baru tanpa menimpa hasil sebelumnya?`))return false;p.duplicateApproved=true}const r={id:uid(),name,answers:[...p.answers],preview:p.preview||null,createdAt:Date.now()};exam.records.push(r);exam.updatedAt=Date.now();activity(exam,`Hasil ${name} disimpan`);persist();pending=pending.filter(x=>x.id!==p.id);toast('Hasil tersimpan');render();return true}

function canvasFromImage(img){const scale=Math.min(1,1600/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)),h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0,w,h);return c}

function findMarkers(imageData,w,h){const d=imageData.data,n=w*h,minDim=Math.min(w,h),tile=32,cols=Math.ceil(w/tile),rows=Math.ceil(h/tile),sums=new Float32Array(cols*rows),counts=new Uint16Array(cols*rows);
 for(let y=0;y<h;y+=1){let row=y*w*4;for(let x=0;x<w;x++){let p=row+x*4,idx=Math.floor(y/tile)*cols+Math.floor(x/tile);sums[idx]+=d[p]*.299+d[p+1]*.587+d[p+2]*.114;counts[idx]++}}

document.addEventListener('input',e=>{if(e.target.id==='historySearch'){historySearch=e.target.value;const pos=e.target.selectionStart;renderHistory();const n=$('#historySearch');n?.focus();n?.setSelectionRange(pos,pos)}if(e.target.matches('[data-pending-name]')){const p=pending.find(x=>x.id===e.target.dataset.pendingName);if(p)p.name=e.target.value}if(e.target.matches('[data-record-name]')){const r=activeExam()?.records.find(x=>x.id===e.target.dataset.recordName);if(r)r.name=e.target.value}});

$('#themeButton').addEventListener('click',toggleTheme);$('#brandButton').addEventListener('click',showCover);$('#shutterButton').addEventListener('click',()=>takeCameraPhoto(false));$('#coverLogo').addEventListener('click',dismissCover);$('#coverLogo').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dismissCover()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#cover').classList.contains('open'))dismissCover();else if($('#cameraModal').classList.contains('open'))closeCamera();else if($('#generalModal').classList.contains('open'))$('#generalModal').classList.remove('open')}});
function init(){themeInit();const t=document.documentElement.dataset.theme|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');$('#themeButton').textContent=t==='dark'?'☀':'☾';render();coverCheck();if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW',e));let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload()}})}}
init();
window.__LJK_TEST__={FORM,bubblePos,detectSheets,scanImageData,scanDataUrl:async(url)=>{const img=new Image();img.src=url;await img.decode();const c=canvasFromImage(img);return scanImageData(imageDataForCanvas(c),c.width,c.height)},readAnswers,calcStats,getState:()=>state,getPending:()=>pending,activateDemo,processImageElement,openCamera,takeCameraPhoto,findMarkers};
</script>
